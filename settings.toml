SAMPLES_BUFFER_SIZE = 65536
RX_OUTPUT_TYPE = "raw"

[ADALM-Pluto.URI]
IP = "ip:192.168.2.1"
USB = "usb:"
SN_RX = "10447318ac0f00091e002400454e18b77d"
SN_TX = "1044739a470b000a090018007ecf7f5ea8"

[bpsk]
SPS = 4                             # samples per symbol

[rrc_filter]
